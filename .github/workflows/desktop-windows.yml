# デスクトップ版(Windows)を作って確かめる(python-web-tools・coil-packing-tools の同名のものを移した)
#
# 作るもの: FileListTool.exe(成果物 "FileListTool-windows" から取れる)。
# 配るときは、アプリのフォルダの直下(Start.vbs と同じ所)に置いてから
# scripts\make_dist.py を流す(「ファイル名一覧取得.exe」の名前で配布フォルダに入る)。
#
# 確かめること(ラインPCと同じ Windows の上で):
#   - Python の試験(標準入出力のやりとり・ファイルの錠・道の書き方は OS で違いが出やすい)
#   - Rust の試験
#   - 作った exe を本当に起動し、画面が Python から届くこと・ポートで待ち受けないこと・
#     2つ目の exe が起動しないこと・ブラウザ版とのすみ分け・stop.bat で閉じること(窓に WM_CLOSE)
name: デスクトップ版(Windows)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 追加の部品は入れない(ラインPCと同じく標準ライブラリだけで動くことも確かめる)
      - name: Python の試験
        run: python -m unittest discover -s tests -t . -v

      - uses: dtolnay/rust-toolchain@stable
        if: success() || failure()

      - uses: Swatinem/rust-cache@v2
        if: success() || failure()
        with:
          workspaces: src-tauri

      - name: Rust の試験
        if: success() || failure()
        working-directory: src-tauri
        run: cargo test --release

      - name: exe を作る
        id: build
        if: success() || failure()
        working-directory: src-tauri
        run: cargo build --release

      - name: 作った exe を起動して確かめる
        if: (success() || failure()) && steps.build.outcome == 'success'
        run: python scripts/desktop_smoke.py --exe src-tauri/target/release/FileListTool.exe

      - uses: actions/upload-artifact@v4
        if: (success() || failure()) && steps.build.outcome == 'success'
        with:
          name: FileListTool-windows
          path: src-tauri/target/release/FileListTool.exe
          if-no-files-found: error
