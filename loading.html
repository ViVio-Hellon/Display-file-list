<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>起動しています - {{APP_NAME}}</title>
<link rel="icon" href="data:,">
<!--
  起動待機表示 (基盤仕様書 2.2 / 2.3)
  一定秒数で完了扱いにせず、/api/health の app_id と ready を見てから業務画面へ移る。
  外のファイル(CSS)を取りに行かない ── 取りに行く分だけ遅れ、失敗の理由にもなる。
-->
<style>
:root{--a:#153247;--b:#1e6079;--ink:#fff;--muted:#c3dbe4;--ok:#8ff0c4;--alert:#ffc4bf;--face:#ffffff14}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--ink);
  font-family:system-ui,"Segoe UI","Yu Gothic UI","Meiryo UI",sans-serif;background:linear-gradient(115deg,var(--a),var(--b))}
.box{width:min(460px,92vw);background:var(--face);border-radius:12px;padding:28px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:12px;margin:0 0 18px}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
li{display:flex;gap:10px;align-items:center;color:var(--muted)}
li::before{content:"・";width:1.2em;text-align:center}
li.done{color:var(--ink)} li.done::before{content:"✓";color:var(--ok)}
li.now{color:var(--ink);font-weight:700} li.now::before{content:"▶"}
.time{margin-top:16px;font-size:12px;color:var(--muted)}
.err{margin-top:16px;color:var(--alert);font-size:13px;line-height:1.6;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box">
  <h1>{{APP_NAME}}</h1>
  <p class="sub">VER{{VERSION}} を起動しています</p>
  <ol id="steps">
    <li data-k="env" class="done">実行環境を確認中</li>
    <li data-k="prepare">アプリを準備中</li>
    <li data-k="connect">接続を確認中</li>
    <li data-k="ready">起動完了</li>
  </ol>
  <div class="time" id="time">経過 0 秒</div>
  <div class="err" id="err" hidden></div>
</div>
<script>
(function () {
  var APP_ID = "{{APP_ID}}";
  var started = Date.now();
  var order = ["env", "prepare", "connect", "ready"];
  var stageKey = { "アプリを準備中": "prepare", "接続を確認中": "connect", "起動完了": "ready" };
  function mark(k) {
    var idx = order.indexOf(k);
    var items = document.querySelectorAll("#steps li");
    for (var i = 0; i < items.length; i++) {
      items[i].className = i < idx ? "done" : (i === idx ? "now" : "");
    }
  }
  function fail(msg) {
    var e = document.getElementById("err");
    e.hidden = false;
    e.textContent = msg + "\n\nログ: %LOCALAPPDATA%\\FileListTool\\logs の launcher.log / server.log\n" +
      "うまくいかないときは start.bat から起動すると、理由がコンソールに出ます。";
  }
  function poll() {
    var sec = Math.floor((Date.now() - started) / 1000);
    document.getElementById("time").textContent = "経過 " + sec + " 秒";
    fetch("/api/health", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (h) {
      if (h.app_id !== APP_ID) { fail("別のアプリが応答しています。"); return; }
      if (h.error) { fail("起動できませんでした: " + h.error); return; }
      mark(stageKey[h.stage] || "prepare");
      if (h.ready) { mark("ready"); location.replace("/"); return; }
      setTimeout(poll, 300);
    }).catch(function () {
      if (sec > 30) { fail("アプリから応答がありません。"); return; }
      setTimeout(poll, 500);
    });
  }
  poll();
  // 心拍。**起動に失敗して理由を出しているあいだも**送る。この画面を閉じれば
  // アプリは少しして自分で終わる(閉じたあとも Python が残り続けないように)
  function beat() { fetch("/api/alive", { method: "POST" }).catch(function () {}); }
  beat();
  setInterval(beat, {{HEARTBEAT}} * 1000);
  window.addEventListener("pagehide", function () {
    try { navigator.sendBeacon("/api/bye", new Blob(["{}"], { type: "application/json" })); } catch (e) {}
  });
})();
</script>
</body>
</html>
